name: Bug report
description: The script failed, printed an error, or a tweak did not apply / did not stick / did not revert.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not a bug:** no FPS change after raising the timer resolution, mouse stutter after `useplatformtick`, or a holder task with no system-wide effect on Windows 11 - all three are explained in the [FAQ](https://github.com/vadyaravadim/timer-resolution-utility#faq).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of -Status
      description: |
        Changes nothing. It asks for admin rights because it reads the boot configuration; copy the text from the elevated window. It shows the script version, the timer resolution, the `bcdedit` values, HPET, the Windows 11 global requests value and the holder task, which answers most follow-up questions up front. If `-Status` itself fails, paste the error.
        - PowerShell Gallery: `timer-resolution-utility -Status`
        - One-liner: `powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE\timer-resolution-utility.ps1" -Status`
        - ZIP / clone, from the script's folder: `powershell -ExecutionPolicy Bypass -File .\timer-resolution-utility.ps1 -Status`
      render: text
    validations:
      required: true
  - type: textarea
    id: run-output
    attributes:
      label: Output of the run that went wrong
      description: Everything the script printed, including any red ERROR line. Skip it if the window closed before you could copy it, and say so above.
      render: text
  - type: dropdown
    id: launch-method
    attributes:
      label: How did you run it?
      description: Each method reaches the script through a different relaunch path, and that is where launch bugs live.
      options:
        - PowerShell Gallery (Install-Script)
        - irm | iex one-liner
        - Run.bat from the ZIP
        - .ps1 directly (clone or download)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display language
      description: Win+R, `winver`. The display language matters - `bcdedit` output is localized.
      placeholder: Windows 11 24H2, build 26100.4061, German
    validations:
      required: true
